<body>

```
<main class="plant-container">

    <section class="plant-card">

        <h1>Our Little Plant 🌹</h1>

        <p class="subtitle">
            A little plant that needs both of us.
        </p>

        <div class="plant-display">
            <div id="plantImage" class="plant-image">🌱</div>
        </div>

        <p id="plantStatus" class="plant-status">
            Waiting to be watered...
        </p>

        <div class="watering-info">

            <div class="person">
                <span class="person-name">Mini</span>
                <span id="miniStatus" class="water-status">
                    Not watered
                </span>
            </div>

            <div class="person">
                <span class="person-name">Darius</span>
                <span id="dariusStatus" class="water-status">
                    Not watered
                </span>
            </div>

        </div>

        <button id="waterButton" onclick="waterPlant()">
            Water the Plant 💧
        </button>

        <p id="message" class="message"></p>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
```

</body>
</html>
